name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Vitest Unit Tests
        run: npx vitest run

  security:
    name: Secrets & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Uncommitted Sensitive Files
        run: |
          echo "Scanning for sensitive credentials..."
          ! grep -rE "(sk_live_[0-9a-zA-Z]{24}|ghp_[0-9a-zA-Z]{36})" src/
